<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan Ioannoni | Portfolio</title>
    <style>
        /* Apple Premium Dark/Structural Design System with Photo Depth Integration */
        :root {
            --bg-surface: rgba(28, 28, 30, 0.75);
            --text-primary: #ffffff;
            --text-secondary: #aeaeb2;
            --accent-blue: #2997ff;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Native smooth scrolling transition for navigation anchors */
        html {
            scroll-behavior: smooth;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('1000000769.jpg');
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            
            color: var(--text-primary);
            font-family: var(--font-family);
            letter-spacing: -0.011em;
            line-height: 1.47059;
            padding-top: 48px;
            -webkit-font-smoothing: antialiased;
        }

        /* Apple Compact Global Navigation Bar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(22, 22, 23, 0.75);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            z-index: 9999;
            border-bottom: 1px solid var(--border-subtle);
        }

        .nav-container {
            max-width: 1024px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 22px;
        }

        .logo {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        /* Segmented Navigation Menu Controls */
        .nav-menu {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .nav-btn {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .git-profile {
            font-size: 12px;
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 400;
        }

        .git-profile:hover {
            text-decoration: underline;
        }

        /* Bold Hero Segment */
        .hero {
            max-width: 1024px;
            margin: 110px auto 60px auto;
            padding: 0 40px;
            text-align: left;
        }

        .hero h1 {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.07;
            margin-bottom: 20px;
            color: var(--text-primary);
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
        }

        .hero p {
            font-size: 24px;
            color: var(--text-secondary);
            font-weight: 500;
            max-width: 750px;
            line-height: 1.25;
            letter-spacing: -0.015em;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.6);
        }

        /* Philosophy Panel with a dark frosted glass effect */
        .statement-banner {
            max-width: 944px;
            margin: 0 auto 50px auto;
            background-color: var(--bg-surface);
            backdrop-filter: blur(25px) saturate(140%);
            -webkit-backdrop-filter: blur(25px) saturate(140%);
            border-radius: 28px;
            padding: 50px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .statement-banner p {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }

        .statement-banner a {
            font-size: 15px;
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
        }

        .statement-banner a:hover span {
            transform: translateX(4px);
        }

        .statement-banner a span {
            transition: transform 0.2s ease;
            margin-left: 5px;
        }

        /* Asymmetric Layout Grid */
        .showcase-grid {
            max-width: 944px;
            margin: 0 auto 100px auto;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
        }

        /* Dedicated padding adjustment for target anchors so fixed header doesn't cover content */
        .anchor-section {
            scroll-margin-top: 70px;
        }

        .bento-card {
            background-color: var(--bg-surface);
            backdrop-filter: blur(25px) saturate(140%);
            -webkit-backdrop-filter: blur(25px) saturate(140%);
            border-radius: 28px;
            padding: 40px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
        }

        .bento-card:hover {
            transform: scale(1.005);
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.4);
        }

        /* Card Width Configurations */
        .size-wide { grid-column: span 12; min-height: 280px; }
        .size-left { grid-column: span 7; min-height: 340px; }
        .size-right { grid-column: span 5; min-height: 340px; }

        .card-meta {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }

        .bento-card h2 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.015em;
            margin-bottom: 16px;
            line-height: 1.15;
        }

        .card-content p {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 14px;
            line-height: 1.45;
        }

        .card-content strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Integrated Photo Gallery Grid Architecture */
        .photo-gallery {
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 16 / 10;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .gallery-label {
            position: absolute;
            bottom: 14px;
            left: 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Universal Site Footer */
        footer {
            max-width: 944px;
            margin: 0 auto;
            padding: 30px 40px 60px 40px;
            border-top: 1px solid var(--border-subtle);
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .showcase-grid { display: flex; flex-direction: column; padding: 0 20px; }
            .hero h1 { font-size: 40px; }
            .hero p { font-size: 18px; }
            .statement-banner { margin: 0 20px 40px 20px; padding: 30px; }
            .nav-menu { display: none; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">Jordan Ioannoni</a>
            
            <!-- Segmented Control Navigation Links connected via target IDs -->
            <nav class="nav-menu">
                <a href="#photography" class="nav-btn">Media Production</a>
                <a href="#automation" class="nav-btn">Systems Architecture</a>
                <a href="#operations" class="nav-btn">Business Assets</a>
            </nav>
